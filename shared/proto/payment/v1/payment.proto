syntax = "proto3";

package payment.v1;

option go_package = "github.com/ownxrflxr/OnlineShop/shared/pkg/proto/payment/v1;payment_v1";

// PaymentService предоставляет API для работы с платежным шлюзом
service PaymentService {
  // Обрабатывает команду на оплату и возвращает transaction_uuid
  rpc PayOrder(PayOrderRequest) returns (PayOrderResponse);
}

// UUID транзакции оплаты
message PayOrderResponse {
  // UUID транзакции оплаты
  string transaction_uuid = 1;
}

// Информация для оплаты заказа
message PayOrderRequest {
  // UUID заказа
  string order_uuid = 1;

  // UUID пользователя, который инициирует оплату
  string user_uuid = 2;

  // Выбранный способ оплаты
  PaymentMethod payment_method = 3;
}

// Возможные методы оплаты заказа
enum PaymentMethod {
  // Неизвестный метод
  PAYMENT_METHOD_UNSPECIFIED = 0;

  // Банковская карта
  PAYMENT_METHOD_CARD = 1;

  // Система быстрых платежей
  PAYMENT_METHOD_SBR = 2;

  // Кредитная карта
  PAYMENT_METHOD_CREDIT_CARD = 3;

  // Деньги инвестора (внутренний методы)
  PAYMENT_METHOD_INVESTOR_MONEY = 4;
}